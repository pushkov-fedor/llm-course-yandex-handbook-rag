# ========================================================================
# GitHub Actions workflow для деплоя в Yandex Cloud Serverless Containers
# 
# Требуемые права для CI/CD сервисного аккаунта (YC_SA_ID):
# - container-registry.images.pusher  (для пуша образов)
# - serverless.containers.editor      (для деплоя ревизий)
# - lockbox.admin                     (для передачи секретов в контейнер)
# - iam.serviceAccounts.user          (для назначения Runtime SA)
#
# Требуемые права для Runtime сервисного аккаунта (YC_RUNTIME_SA_ID):
# - container-registry.images.puller  (для скачивания образов)
# - lockbox.payloadViewer             (для чтения секретов в runtime)
# ========================================================================

name: Deploy to Yandex Cloud Serverless Containers

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
      YC_REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}
      YC_IMAGE_REPO: ${{ vars.YC_IMAGE_REPO }}
      YC_CONTAINER_NAME: ${{ vars.YC_CONTAINER_NAME }}
      YC_RUNTIME_SA_ID: ${{ vars.YC_RUNTIME_SA_ID }}
      LOCKBOX_SECRET_ID: ${{ vars.LOCKBOX_SECRET_ID }}
      WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}

    concurrency:
      group: sls-container-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get IAM token via WIF (GitHub OIDC → Yandex Cloud)
        id: iam
        uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
        with:
          yc-sa-id: ${{ secrets.YC_SA_ID }}

      - name: Install yc CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Configure yc (auth + folder)
        env:
          YC_IAM_TOKEN: ${{ steps.iam.outputs.token }}
        run: |
          export PATH="$HOME/yandex-cloud/bin:$PATH"
          yc --version
          yc config set folder-id "${YC_FOLDER_ID}"
          yc config list

      - name: Verify CI/CD permissions
        env:
          YC_IAM_TOKEN: ${{ steps.iam.outputs.token }}
        run: |
          set -euo pipefail
          export PATH="$HOME/yandex-cloud/bin:$PATH"
          
          EXIT_CODE=0

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 Проверка прав CI/CD сервисного аккаунта"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          echo ""
          echo "👤 Текущая идентичность:"
          yc iam whoami

          echo ""
          echo "🔐 Lockbox secret (${LOCKBOX_SECRET_ID}):"
          if yc lockbox secret get --id "${LOCKBOX_SECRET_ID}" --format json | jq -r .name > /dev/null 2>&1; then
            echo "   ✅ Доступен для чтения"
          else
            echo "   ❌ НЕТ ДОСТУПА! Требуется роль: lockbox.admin"
            EXIT_CODE=1
          fi

          echo ""
          echo "🐳 Container Registry (${YC_REGISTRY_ID}):"
          if yc container registry get --id "${YC_REGISTRY_ID}" --format json | jq -r .name > /dev/null 2>&1; then
            echo "   ✅ Доступен"
          else
            echo "   ❌ НЕТ ДОСТУПА! Требуется роль: container-registry.images.pusher"
            EXIT_CODE=1
          fi

          echo ""
          echo "📦 Serverless Container (${YC_CONTAINER_NAME}):"
          if yc serverless container get "${YC_CONTAINER_NAME}" --format json | jq -r .id > /dev/null 2>&1; then
            echo "   ✅ Доступен"
          else
            echo "   ❌ НЕТ ДОСТУПА! Требуется роль: serverless.containers.editor"
            EXIT_CODE=1
          fi

          echo ""
          echo "🤖 Runtime SA (${YC_RUNTIME_SA_ID}):"
          if yc iam service-account get "${YC_RUNTIME_SA_ID}" --format json | jq -r .name > /dev/null 2>&1; then
            echo "   ✅ Доступен"
          else
            echo "   ❌ НЕТ ДОСТУПА! Требуется роль: iam.serviceAccounts.user"
            EXIT_CODE=1
          fi

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Проверка прав провалена!"
            exit 1
          fi
          
          echo "✅ Все проверки пройдены успешно!"

      - name: Docker login to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: iam
          password: ${{ steps.iam.outputs.token }}

      - name: Build & push image
        run: |
          set -euo pipefail
          IMAGE="cr.yandex/${YC_REGISTRY_ID}/${YC_IMAGE_REPO}:${GITHUB_SHA}"
          
          echo "🏗️  Building Docker image..."
          docker build -t "${IMAGE}" .
          
          echo "📤 Pushing image to registry..."
          docker push "${IMAGE}"
          
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "✅ Image pushed: ${IMAGE}"

      - name: Resolve container ID
        env:
          YC_IAM_TOKEN: ${{ steps.iam.outputs.token }}
        run: |
          set -euo pipefail
          export PATH="$HOME/yandex-cloud/bin:$PATH"
          
          CONTAINER_ID="$(yc serverless container get "${YC_CONTAINER_NAME}" --format json | jq -r .id)"
          echo "YC_CONTAINER_ID=${CONTAINER_ID}" >> "$GITHUB_ENV"
          echo "✅ Resolved container ID: ${CONTAINER_ID}"

      - name: Deploy new revision
        env:
          YC_IAM_TOKEN: ${{ steps.iam.outputs.token }}
        run: |
          set -euo pipefail
          export PATH="$HOME/yandex-cloud/bin:$PATH"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 Deploying new revision"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📦 Image:        ${IMAGE}"
          echo "🆔 Container ID: ${YC_CONTAINER_ID}"
          echo "🤖 Runtime SA:   ${YC_RUNTIME_SA_ID}"
          echo "🔐 Lockbox ID:   ${LOCKBOX_SECRET_ID}"
          echo ""

          yc serverless container revision deploy \
            --container-id "${YC_CONTAINER_ID}" \
            --image "${IMAGE}" \
            --service-account-id "${YC_RUNTIME_SA_ID}" \
            --cores 1 \
            --memory 4GB \
            --concurrency 1 \
            --execution-timeout 5m \
            --min-instances 1 \
            --environment WEBHOOK_URL="${WEBHOOK_URL}" \
            --secret id="${LOCKBOX_SECRET_ID}",key=TELEGRAM_BOT_TOKEN,environment-variable=TELEGRAM_BOT_TOKEN \
            --secret id="${LOCKBOX_SECRET_ID}",key=OPENROUTER_API_KEY,environment-variable=OPENROUTER_API_KEY

          echo ""
          echo "✅ Deployment completed successfully!"

      - name: Show latest revisions
        if: always()
        env:
          YC_IAM_TOKEN: ${{ steps.iam.outputs.token }}
        run: |
          export PATH="$HOME/yandex-cloud/bin:$PATH"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 Latest revisions:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          yc serverless container revision list --container-name "${YC_CONTAINER_NAME}" --limit 5

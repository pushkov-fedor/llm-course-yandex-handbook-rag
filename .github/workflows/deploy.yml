name: Deploy to Yandex Cloud Serverless Containers

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
      YC_REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}
      YC_IMAGE_REPO: ${{ vars.YC_IMAGE_REPO }}
      YC_CONTAINER_NAME: ${{ vars.YC_CONTAINER_NAME }}
      YC_RUNTIME_SA_ID: ${{ vars.YC_RUNTIME_SA_ID }}
      LOCKBOX_SECRET_ID: ${{ vars.LOCKBOX_SECRET_ID }}
      WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}

    concurrency:
      group: sls-container-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get IAM token via WIF (GitHub OIDC → Yandex Cloud)
        id: iam
        uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
        with:
          yc-sa-id: ${{ secrets.YC_SA_ID }}

      - name: Install yc CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Configure yc (auth + folder)
        env:
          YC_IAM_TOKEN: ${{ steps.iam.outputs.token }}
        run: |
          export PATH="$HOME/yandex-cloud/bin:$PATH"
          yc --version
          yc config set folder-id "${YC_FOLDER_ID}"
          yc config list

      - name: Docker login to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: iam
          password: ${{ steps.iam.outputs.token }}

      - name: Build & push image
        run: |
          set -euo pipefail
          IMAGE="cr.yandex/${YC_REGISTRY_ID}/${YC_IMAGE_REPO}:${GITHUB_SHA}"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Resolve container ID
        env:
          YC_IAM_TOKEN: ${{ steps.iam.outputs.token }}
        run: |
          set -euo pipefail
          export PATH="$HOME/yandex-cloud/bin:$PATH"
          CONTAINER_ID="$(yc serverless container get "${YC_CONTAINER_NAME}" --format json --jq .id)"
          echo "YC_CONTAINER_ID=${CONTAINER_ID}" >> "$GITHUB_ENV"
          echo "Resolved YC_CONTAINER_ID=${CONTAINER_ID}"

      - name: Verify permissions
        env:
          YC_IAM_TOKEN: ${{ steps.iam.outputs.token }}
        run: |
          set -euo pipefail
          export PATH="$HOME/yandex-cloud/bin:$PATH"

          echo "=== Deploying SA identity ==="
          yc iam whoami

          echo ""
          echo "=== Lockbox secret access (${LOCKBOX_SECRET_ID}) ==="
          yc lockbox secret get --id "${LOCKBOX_SECRET_ID}" --format json --jq .name \
            && echo "✅ Lockbox secret readable" \
            || echo "❌ Cannot access Lockbox secret"

          echo ""
          echo "=== Container Registry access (${YC_REGISTRY_ID}) ==="
          yc container registry get --id "${YC_REGISTRY_ID}" --format json --jq .name \
            && echo "✅ Container Registry readable" \
            || echo "❌ Cannot access Container Registry"

          echo ""
          echo "=== Serverless Container access (${YC_CONTAINER_NAME}) ==="
          yc serverless container get "${YC_CONTAINER_NAME}" --format json --jq .id \
            && echo "✅ Serverless Container readable" \
            || echo "❌ Cannot access Serverless Container"

          echo ""
          echo "=== Runtime SA roles (${YC_RUNTIME_SA_ID}) ==="
          yc iam service-account get "${YC_RUNTIME_SA_ID}" --format json --jq .name \
            && echo "✅ Runtime SA accessible" \
            || echo "❌ Cannot access Runtime SA"

      - name: Deploy new revision
        env:
          YC_IAM_TOKEN: ${{ steps.iam.outputs.token }}
        run: |
          set -euo pipefail
          export PATH="$HOME/yandex-cloud/bin:$PATH"

          yc serverless container revision deploy \
            --container-id "${YC_CONTAINER_ID}" \
            --image "${IMAGE}" \
            --service-account-id "${YC_RUNTIME_SA_ID}" \
            --cores 1 \
            --memory 4GB \
            --concurrency 1 \
            --execution-timeout 5m \
            --min-instances 1 \
            --environment WEBHOOK_URL="${WEBHOOK_URL}" \
            --secret id="${LOCKBOX_SECRET_ID}",key=TELEGRAM_BOT_TOKEN,environment-variable=TELEGRAM_BOT_TOKEN \
            --secret id="${LOCKBOX_SECRET_ID}",key=OPENROUTER_API_KEY,environment-variable=OPENROUTER_API_KEY

      - name: Show latest revisions
        env:
          YC_IAM_TOKEN: ${{ steps.iam.outputs.token }}
        run: |
          export PATH="$HOME/yandex-cloud/bin:$PATH"
          yc serverless container revision list --container-name "${YC_CONTAINER_NAME}" | head -n 10
